name: PocketSpeaker
options:
  bundleIdPrefix: com.lanrhyme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Xcode 15 ships Swift 5.9 and is available on the last Intel-compatible
    # macOS releases. Device builds remain arm64; Intel hosts use x86_64 only
    # for the iOS Simulator.
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    "ARCHS[sdk=iphoneos*]": arm64
    "ARCHS[sdk=iphonesimulator*]": "$(ARCHS_STANDARD)"
targets:
  PocketSpeaker:
    type: application
    platform: iOS
    sources: [MicYou]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketspeaker.ios
        PRODUCT_NAME: Pocket Speaker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MicYou/Info.plist
        ONLY_ACTIVE_ARCH: NO
    scheme:
      testTargets: [PocketSpeakerTests]
  PocketSpeakerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MicYouTests]
    dependencies:
      - target: PocketSpeaker
