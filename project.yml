name: MicYou
options:
  bundleIdPrefix: com.lanrhyme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
targets:
  MicYou:
    type: application
    platform: iOS
    sources: [MicYou]
    info:
      path: MicYou/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanrhyme.micyou.ios
        PRODUCT_NAME: MicYou
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: [MicYouTests]
  MicYouTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MicYouTests]
    dependencies:
      - target: MicYou

