name: PocketSpeakerServer
options:
  deploymentTarget: { macOS: "13.0" }
settings:
  base: { SWIFT_VERSION: 5.9, MACOSX_DEPLOYMENT_TARGET: "13.0" }
targets:
  PocketSpeakerServer:
    type: application
    platform: macOS
    sources: [PocketSpeaker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketspeaker.server.macos
        PRODUCT_NAME: Pocket Speaker
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PocketSpeaker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
